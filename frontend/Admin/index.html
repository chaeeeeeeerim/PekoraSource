<body>
<div id="root"></div>
<script>
(function () {
  var root = document.getElementById("root");
  function showFailure(message) {
    if (!root || (root.textContent && root.textContent.trim())) return;
    root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff7fb;color:#302431;font:14px/1.5 Arial,sans-serif"><section style="max-width:520px;padding:24px;border:1px solid #f0cddd;border-radius:12px;background:#fff"><h1 style="margin-top:0">Kandi Admin could not start</h1><p>The admin interface failed to load. Refresh the page and check the browser console or Vercel deployment logs.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;color:#9b245e"></pre><a href="/">Back to Kandi</a></section></main>';
    root.querySelector("pre").textContent = String(message || "Unknown startup error");
  }
  window.addEventListener("error", function (event) {
    showFailure(event.message || (event.target && event.target.src) || "A script or asset failed to load");
  }, true);
  window.addEventListener("unhandledrejection", function (event) {
    showFailure(event.reason && event.reason.message || event.reason || "Unhandled promise rejection");
  });
})();
</script>
<!-- Painel administrativo (SÓ FRONTEND). Ordem importa: config -> dados demo -> camada de dados -> UI -> páginas -> boot. -->
<script src="js/config.js"></script>
<script src="js/data/demo-data.js"></script>
<script src="js/data/admin-data.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
