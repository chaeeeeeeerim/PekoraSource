<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Kandi</title>
<meta name="description" content="Project Kandi. Powering Nostalgia.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/favicon-192.png">
<meta property="og:type" content="website"><meta property="og:title" content="Project Kandi"><meta property="og:description" content="Project Kandi. Powering Nostalgia.">
<!-- TODO: og:image/twitter:image precisam de URL absoluta do domínio final (ex.: https://SEU-DOMINIO/assets/og-image.jpg) para a prévia funcionar em redes sociais. -->
<meta property="og:image" content="assets/og-image.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="assets/og-image.jpg">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%}
body{background:#202328;color:#fff;font:15px/1.5 Roboto,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
.tabs{position:sticky;top:0;z-index:5;display:flex;background:#2b2f36;border-bottom:1px solid #3a3f48;padding-top:env(safe-area-inset-top,0px)}
.tabs a{flex:1;text-align:center;padding:15px 8px;color:#b9bec7;font-weight:500;text-decoration:none;border-bottom:3px solid transparent}.tabs a.on{color:#fff;border-color:#e0509c}
.hero{position:relative;height:min(52vw,420px);min-height:210px;background:#111 url(assets/og-image.jpg) center/cover}.hero b{position:absolute;left:16px;bottom:14px;font-size:clamp(30px,8vw,56px);text-shadow:0 2px 10px #000}
main{max-width:520px;margin:0 auto;padding:24px 18px 60px}h1,h2{font-weight:500;margin:0 0 12px;text-align:center}h2{font-size:21px}
p{margin:8px 0}.mu{color:#aeb4bd;font-size:13px}form{display:flex;flex-direction:column;gap:12px}label{font-weight:500}
input,textarea{width:100%;background:#fff;color:#222;border:1px solid #ccc;border-radius:4px;padding:11px;font:inherit}textarea{min-height:90px}
.btn{border:0;border-radius:4px;background:#0d6efd;color:#fff;padding:12px 16px;font:500 16px Roboto,Arial;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}.btn:disabled{opacity:.55;cursor:default}.btn.s{padding:6px 12px;font-size:13px}
.bx{background:#cfe3ff;color:#16345c;padding:12px;border-radius:4px;word-break:break-all;font-weight:500}.al{padding:10px 12px;border-radius:4px;background:#5a2330;border:1px solid #a1213a;margin-bottom:12px}.al.ok{background:#1e4a33;border-color:#2f8f5b}
.st{margin:26px 0 8px;font-size:18px;font-weight:500}.c{text-align:center}hr{border:0;border-top:1px solid #3a3f48;margin:28px 0}a.l{color:#6ea8fe}
#tb{position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:rgba(224,80,156,.92);padding:5px 12px;border-radius:14px;font-size:12px;font-weight:700;z-index:9}
</style>
</head>
<body>
<nav class="tabs" role="tablist"><a href="#login" id="tL" role="tab">Login</a><a href="#signup" id="tA" role="tab">Create Account</a></nav>
<div class="hero" role="img" aria-label="Project Kandi"><b>Powering Creativity and Nostalgia</b></div>
<main>
  <div class="al" id="al" role="alert" hidden></div>
  <section id="vL">
    <h1>Welcome to Kandi</h1>
    <p class="c mu">Sign in with your Kandi username and password.</p>
    <form id="fL" novalidate>
      <input id="lu" name="username" placeholder="Username" autocomplete="username" maxlength="20" required>
      <input id="lp" name="password" type="password" placeholder="Password" autocomplete="current-password" maxlength="128" required>
      <input id="lc" placeholder="2FA code (if enabled)" inputmode="numeric" autocomplete="one-time-code" maxlength="8" hidden>
      <button class="btn" id="bL" type="submit">Log In</button>
    </form>
    <hr><p class="c">New to Kandi?</p>
    <p class="c"><a class="btn" href="#signup">Create Account</a></p>
  </section>
  <section id="vA" hidden>
    <h1>Create Account</h1>
    <p class="c mu">Create an account using a username and password. Discord verification and account applications are disabled.</p>
    <form id="fA" novalidate>
      <input id="au" name="username" placeholder="Username" autocomplete="username" maxlength="20" required>
      <input id="ap" name="new-password" type="password" placeholder="Password" autocomplete="new-password" maxlength="128" required>
      <button class="btn" id="bA" type="submit">Create Account</button>
    </form>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/api/auth.js"></script>
<script>
(function () {
  "use strict";
  var A = window.KandiAPI;
  var C = window.KANDI_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var APP = C.APP_URL || "app.html";

  function say(message) {
    var el = $("al");
    el.textContent = message || "";
    el.hidden = !message;
  }
  function fail(error) {
    if (error && error.status === 401 && error.data && error.data.twoFactor) $("lc").hidden = false;
    var fields = error && error.fields
      ? Object.keys(error.fields).map(function (key) { return error.fields[key]; }).join(" ")
      : "";
    say(fields || (error && error.message) || "Could not complete the request.");
  }
  function view() {
    var signup = location.hash === "#signup";
    $("vL").hidden = signup;
    $("vA").hidden = !signup;
    $("tL").classList.toggle("on", !signup);
    $("tA").classList.toggle("on", signup);
    say("");
  }

  window.addEventListener("hashchange", view);
  view();

  if (A) {
    A.me().then(function () {
      location.replace(APP + "#home");
    }).catch(function (error) {
      if (error && error.kind === "network") say("The Kandi server could not be reached.");
    });
  }

  $("fL").addEventListener("submit", function (event) {
    event.preventDefault();
    var username = $("lu").value.trim();
    var password = $("lp").value;
    var code = $("lc").hidden ? "" : $("lc").value.trim();
    if (!username || !password) return say("Enter your username and password.");
    say("");
    var button = $("bL");
    button.disabled = true;
    A.login({ username: code ? username + "|" + code : username, password: password })
      .then(function () { location.replace(APP + "#home"); })
      .catch(fail)
      .then(function () { button.disabled = false; });
  });

  $("fA").addEventListener("submit", function (event) {
    event.preventDefault();
    var username = $("au").value.trim();
    var password = $("ap").value;
    if (!/^[A-Za-z0-9_]{3,20}$/.test(username))
      return say("Username must be 3-20 letters, numbers or underscores.");
    if (password.length < 6)
      return say("Password must be at least 6 characters.");
    say("");
    var button = $("bA");
    button.disabled = true;
    A.signup({ username: username, password: password })
      .then(function () { location.replace(APP + "#home"); })
      .catch(fail)
      .then(function () { button.disabled = false; });
  });
})();
</script>
</body>
</html>
