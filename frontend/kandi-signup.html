<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Create Account · Kandi</title><link rel="icon" href="assets/favicon-32.png"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#24232a;color:#fff;font:15px/1.5 Arial,sans-serif;display:grid;place-items:center;padding:20px}.panel{width:min(100%,440px);background:#302d36;border:1px solid #514451;border-radius:14px;padding:26px;box-shadow:0 18px 50px #0005}h1{text-align:center;margin:0 0 8px}p{color:#d3cbd4}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border-radius:7px;border:1px solid #777;background:#fff;color:#222;font:inherit}.btn{width:100%;border:0;border-radius:7px;background:#e65a9e;color:#fff;font-weight:700;padding:13px;margin-top:18px;font:inherit;cursor:pointer}.btn:disabled{opacity:.55}.err{color:#ff9ebd;min-height:24px}.muted{text-align:center;font-size:13px}.muted a,a{color:#ff9ecb}.logo{display:block;width:74px;height:74px;object-fit:contain;margin:0 auto 12px}.captcha{margin-top:14px;min-height:65px}
</style></head><body><main class="panel"><img class="logo" src="assets/k.png" alt="Kandi"><h1>Create your Kandi account</h1><p class="muted">Choose a username and password. Discord is not required for this quick signup.</p><div class="err" id="status" role="status">Checking signup availability…</div><form id="signup" hidden><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="20" required pattern="[A-Za-z0-9_]+"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="3" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="3" required><div class="captcha" id="captcha"></div><p class="err" id="error" role="alert"></p><button class="btn" id="submit" disabled>Create Account</button></form><p class="muted">Already registered? <a href="/kandi/login">Log in</a></p><p class="muted"><a href="/">Back to homepage</a></p></main>
<script src="js/config.js"></script><script src="js/api.js"></script><script>
(function(){
  var E=window.KandiAPI.E,token="";
  window.KandiAPI.define("quickAuth",{
    config:E("GET",{p:"/kandi/v1/auth/signup-config",auth:false}),
    signup:E("POST",{p:"/kandi/v1/auth/signup",auth:false})
  });
  var form=document.getElementById("signup"),status=document.getElementById("status"),error=document.getElementById("error"),button=document.getElementById("submit");
  window.KandiAPI.call("quickAuth.config").then(function(c){
    if(!c.enabled){status.textContent="Quick signup is currently disabled on this test server.";return;}
    if(!c.siteKey){status.textContent="Signup is not configured: the server has no Turnstile public key.";return;}
    form.hidden=false;status.textContent="Complete the security check to create your account.";
    var s=document.createElement("script");s.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";s.async=true;s.defer=true;
    s.onload=function(){window.turnstile.render("#captcha",{sitekey:c.siteKey,callback:function(v){token=v;button.disabled=false;}, "expired-callback":function(){token="";button.disabled=true;}});};
    document.head.appendChild(s);
  }).catch(function(e){status.textContent=e.message||"Could not load signup settings.";});
  form.addEventListener("submit",async function(ev){
    ev.preventDefault();error.textContent="";
    if(form.password.value!==document.getElementById("confirm").value){error.textContent="Passwords do not match.";return;}
    if(!token){error.textContent="Complete the security check first.";return;}
    button.disabled=true;button.textContent="Creating…";
    try{
      await window.KandiAPI.call("quickAuth.signup",{body:{username:form.username.value.trim(),password:form.password.value,captchaToken:token}});
      location.replace("app.html#home");
    }catch(e){error.textContent=e.message||"Could not create the account.";if(window.turnstile)window.turnstile.reset();}
    finally{token="";button.disabled=true;button.textContent="Create Account";}
  });
})();
</script></body></html>
