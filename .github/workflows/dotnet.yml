# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore Roblox\Roblox.sln
    - name: Build
      run: dotnet build Roblox\Roblox.sln --no-restore --configuration Release
    - name: Run unit and integration tests
      run: dotnet test Roblox\Roblox.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-test-results
        path: "**/TestResults/*.trx"
        if-no-files-found: ignore
