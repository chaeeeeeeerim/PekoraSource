name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore Roblox/Roblox.sln
      - name: Build solution
        run: dotnet build Roblox/Roblox.sln --no-restore --configuration Release
      - name: Run unit tests
        run: |
          dotnet test Roblox/Roblox.UnitTest/Roblox.UnitTest.csproj --no-build --configuration Release
          dotnet test Roblox/Roblox.Libraries.UnitTest/Roblox.Libraries.UnitTest.csproj --no-build --configuration Release
          dotnet test Roblox/Roblox.Rendering.Test/Roblox.Rendering.Test.csproj --no-build --configuration Release
      - name: Run database-backed integration tests
        run: |
          docker compose -f Roblox/Roblox.IntegrationTest/docker-compose.yml build
          docker compose -f Roblox/Roblox.IntegrationTest/docker-compose.yml run --rm migrations
          docker compose -f Roblox/Roblox.IntegrationTest/docker-compose.yml run --rm integration_test
      - name: Clean integration services
        if: always()
        run: docker compose -f Roblox/Roblox.IntegrationTest/docker-compose.yml down --volumes --remove-orphans
